<div class="login-container">

    <h2>AgroAgent IA</h2>

    @if(modoRegistro){

        <input
            type="text"
            placeholder="Nombre"
            [(ngModel)]="nombre">

    }

    <input
        type="email"
        placeholder="Correo"
        [(ngModel)]="correo">

    <input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="contrasena">

    @if(!modoRegistro){

        <button (click)="iniciarSesion()">

            Iniciar sesión

        </button>

        <p>

            ¿No tienes cuenta?

            <a (click)="modoRegistro=true">

                Registrarse

            </a>

        </p>

    }

    @if(modoRegistro){

        <button (click)="registrar()">

            Crear cuenta

        </button>

        <p>

            ¿Ya tienes cuenta?

            <a (click)="modoRegistro=false">

                Iniciar sesión

            </a>

        </p>

    }

</div>
