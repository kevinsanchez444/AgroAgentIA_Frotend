<div class="login-container">

    <h2>AgroAgent IA</h2>

    <input
        type="email"
        placeholder="Correo"
        [(ngModel)]="correo">

    <input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="contrasena">

    <button (click)="iniciarSesion()">
        Iniciar sesión
    </button>

</div>
